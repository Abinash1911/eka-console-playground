<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase Explainer</title>
<style>
:root{--bg:#fff;--fg:#0f172a;--muted:#64748b;--line:#475569;--card:#f8fafc;--border:#e2e8f0;
--out-bg:#e0f2fe;--out-bd:#0284c7;--out-fg:#0c4a6e;--part-bg:#ecfdf5;--part-bd:#059669;--part-fg:#064e3b;
--store-bg:#fef9c3;--store-bd:#ca8a04;--store-fg:#713f12;--accent:#2563eb;--ok:#047857;--warn:#b45309;--unk:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e5e7eb;--muted:#94a3b8;--line:#94a3b8;--card:#111a2e;--border:#24304a;
--out-bg:#0c2a40;--out-bd:#38bdf8;--out-fg:#bae6fd;--part-bg:#0b2a22;--part-bd:#34d399;--part-fg:#a7f3d0;
--store-bg:#2b2508;--store-bd:#eab308;--store-fg:#fde68a;--accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--unk:#9ca3af}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e5e7eb;--muted:#94a3b8;--line:#94a3b8;--card:#111a2e;--border:#24304a;
--out-bg:#0c2a40;--out-bd:#38bdf8;--out-fg:#bae6fd;--part-bg:#0b2a22;--part-bd:#34d399;--part-fg:#a7f3d0;
--store-bg:#2b2508;--store-bd:#eab308;--store-fg:#fde68a;--accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--unk:#9ca3af}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 8px}
h2{font-size:1.15rem;margin:36px 0 8px}
.lead{font-size:1.15rem;margin:0 0 6px}
.analogy{color:var(--muted);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:20px 0 8px}
.tabs,.toggle{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:.9rem;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
button[aria-selected="true"],button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,g[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.diagram{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:8px;overflow-x:auto}
svg{display:block;width:100%;min-width:760px;height:auto}
.node{cursor:pointer}
.node rect{stroke-width:2}
.node.sel rect{stroke-width:4}
.node text{pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted);margin:10px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border:2px solid;display:inline-block}
.caption{margin:6px 2px 0;font-weight:600}
.card{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:16px 18px;margin-top:12px;min-height:90px}
.card h3{margin:0 0 2px;font-size:1.1rem}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.card dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
.card dt{color:var(--muted);font-size:.85rem}
.card dd{margin:0}
code{font:.88em ui-monospace,Menlo,Consolas,monospace;background:var(--border);padding:1px 5px;border-radius:4px}
.badge{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid}
.b-confirmed{color:var(--ok)}.b-guess{color:var(--warn)}.b-unknown{color:var(--unk)}
.hint{color:var(--muted)}
.story p{margin:0 0 12px;max-width:70ch}
.terms{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px}
.terms dt{font-weight:600}.terms dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.src{color:var(--muted);font-size:.85rem;margin-top:36px}
@media (max-width:560px){.card dl,.terms{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="lead" id="answer"></p>
<p class="analogy" id="analogy"></p>

<div class="bar">
  <div class="tabs" role="tablist" aria-label="Zoom level" id="tabs"></div>
  <div class="toggle" role="group" aria-label="Label style">
    <button id="m-plain" aria-pressed="true">Plain words</button>
    <button id="m-tech" aria-pressed="false">Technical names</button>
  </div>
</div>
<div class="diagram"><svg id="svg" role="img" aria-labelledby="cap"></svg></div>
<div class="legend" aria-label="Legend">
  <span><i class="sw" style="border-radius:10px;background:var(--out-bg);border-color:var(--out-bd)"></i>Outside the system</span>
  <span><i class="sw" style="border-radius:3px;background:var(--part-bg);border-color:var(--part-bd)"></i>Part of the system</span>
  <span><i class="sw" style="border-radius:3px;background:var(--store-bg);border-color:var(--store-bd)"></i>Where things are saved</span>
  <span><i class="sw" style="width:28px;height:0;border-width:0 0 2px;border-color:var(--line)"></i>Confirmed in the code</span>
  <span><i class="sw" style="width:28px;height:0;border-width:0 0 2px;border-style:dashed;border-color:var(--line)"></i>Guess</span>
</div>
<p class="caption" id="cap"></p>
<div class="card" id="card" aria-live="polite"></div>

<section class="story" id="story"></section>
<section id="terms-s"><h2>Technical corner</h2><dl class="terms" id="terms"></dl></section>
<section id="ripple-s"><h2>If you change something, what else is affected?</h2><table id="ripple"></table></section>
<section id="unknown-s"><h2>What we could not check</h2><div id="unknown"></div></section>
<section id="next-s"><h2>Where to look next</h2><div id="next"></div></section>
<p class="src" id="src"></p>
</main>

<script type="application/json" id="data">{"title": "Voice today: browser and phone calls work, but human handover, caller identity and non-ElevenLabs Indian-language speech are not built", "answer": "We already have a working voice assistant that talks over the browser and over a phone line, using the same agent, tools and knowledge as chat; what is missing for an inbound Indian-language assistant with human handover is mostly around it, not inside it.", "analogy": "Think of a receptionist at a desk: a phone line brings the caller in, an ear turns speech into words, a brain decides, a mouth speaks. The desk exists and works. It has no 'transfer to a colleague' button, it does not look at the caller's number on the screen, and the phone company's settings are done by hand.", "views": [{"label": "Big picture", "caption": "Both entrances (browser and phone) lead to one voice server in matrix, which uses outside speech and AI services and our existing tools.", "nodes": [{"id": "caller", "col": 0, "row": 1, "kind": "outside", "plain": "Caller", "tech": "Person on a phone or in the browser", "job": "Speaks, listens, interrupts.", "where": "-", "status": "confirmed"}, {"id": "phone", "col": 1, "row": 0, "kind": "outside", "plain": "Phone line company", "tech": "Vobiz (Plivo-style telephony)", "job": "Answers a call, asks our server what to do, then streams the caller's audio to us.", "where": "matrix/med_assist/router/voice.py (POST /answer)", "status": "confirmed", "details": "The answer address is set by hand in Vobiz's dashboard. No page in our console manages phone numbers. Whether this line is live in production is not known."}, {"id": "widget", "col": 1, "row": 2, "kind": "part", "plain": "Browser voice button", "tech": "synapse-sdk VoiceAgent (WebRTC)", "job": "Opens the microphone and sends audio live to matrix; shows the voice orb.", "where": "synapse-sdk/packages/core/src/voice/VoiceAgent.ts; widget/src/molecules/voice/", "status": "confirmed", "details": "Not read in depth: how browser sessions are logged in."}, {"id": "matrix", "col": 2, "row": 1, "kind": "part", "plain": "Voice server", "tech": "matrix voice pipeline (Pipecat)", "job": "Runs one call: listens, detects turns, asks the agent, speaks, saves the transcript.", "where": "matrix/med_assist/service/voice/pipeline.py, webrtc_pipeline.py", "status": "confirmed"}, {"id": "ai", "col": 3, "row": 0, "kind": "outside", "plain": "Speech and AI services", "tech": "ElevenLabs STT/TTS, Anthropic Haiku 4.5", "job": "Turns speech into text, text into speech, and writes the replies.", "where": "matrix/med_assist/service/voice/providers.py; config/voice.py", "status": "confirmed", "details": "Only ElevenLabs is accepted for speech. The model is fixed to Claude Haiku 4.5 for voice."}, {"id": "tools", "col": 3, "row": 1, "kind": "part", "plain": "Our tools and knowledge", "tech": "MCP tools, knowledge bases, custom tools", "job": "Book, look up, search. The same set as chat.", "where": "matrix/med_assist/service/voice/pipeline.py (_build_agent); eka-remote-mcp", "status": "confirmed"}, {"id": "settings", "col": 2, "row": 2, "kind": "store", "plain": "Console voice settings", "tech": "agent_voice_configs (shared Postgres)", "job": "Holds each agent's speech provider, keys and language.", "where": "dev-console/agents/models.py (AgentVoiceConfig)", "status": "confirmed"}], "edges": [{"from": "caller", "to": "phone", "label": "phones in", "status": "confirmed"}, {"from": "caller", "to": "widget", "label": "talks in browser", "status": "confirmed"}, {"from": "phone", "to": "matrix", "label": "streams audio", "status": "confirmed", "both": true}, {"from": "widget", "to": "matrix", "label": "streams audio", "status": "confirmed", "both": true}, {"from": "matrix", "to": "ai", "label": "speech and brain", "status": "confirmed"}, {"from": "matrix", "to": "tools", "label": "calls tools", "status": "confirmed"}, {"from": "settings", "to": "matrix", "label": "gives settings", "status": "confirmed"}]}, {"label": "One phone call", "caption": "A call is one straight line. There is no step where a person can take over.", "nodes": [{"id": "ans", "col": 0, "row": 0, "kind": "part", "plain": "Answer the call", "tech": "POST /voice/answer", "job": "Makes a chat session for the call, saves the caller number in it, and tells Vobiz to open an audio stream.", "where": "matrix/med_assist/router/voice.py", "status": "confirmed", "details": "The address is open to anyone who knows it and the audio socket does not check a token. The code comments say to revisit if telephony is revived."}, {"id": "ear", "col": 1, "row": 0, "kind": "part", "plain": "Ear", "tech": "ElevenLabs realtime STT", "job": "Turns the caller's speech into text. Detects the language if none is set.", "where": "service/voice/providers.py (create_stt_service)", "status": "confirmed"}, {"id": "turn", "col": 2, "row": 0, "kind": "part", "plain": "Turn taking", "tech": "Silero VAD, mute strategies", "job": "Decides when the caller has finished, and filters echo of the bot's own voice from the phone line.", "where": "service/voice/pipeline.py; config/voice.py", "status": "confirmed"}, {"id": "brain", "col": 3, "row": 0, "kind": "part", "plain": "Brain", "tech": "echo GenericAgent + Haiku 4.5", "job": "Reads the words, uses tools, writes short spoken replies.", "where": "service/voice/agent_processor.py", "status": "confirmed"}, {"id": "mouth", "col": 3, "row": 1, "kind": "part", "plain": "Mouth", "tech": "ElevenLabs TTS (eleven_flash_v2_5)", "job": "Speaks each sentence as soon as it is written.", "where": "service/voice/providers.py (create_tts_service)", "status": "confirmed"}, {"id": "end", "col": 2, "row": 1, "kind": "part", "plain": "End of call", "tech": "idle timeout, 10 minute cap", "job": "Says goodbye after 10 seconds of silence or at 10 minutes, then stops.", "where": "service/voice/pipeline.py (IDLE_TIMEOUT_SECS, MAX_CALL_DURATION_SECS)", "status": "confirmed"}, {"id": "save", "col": 1, "row": 1, "kind": "store", "plain": "Saved transcript", "tech": "DynamoDB (SessionFlow rows)", "job": "Writes every message of the call when it ends.", "where": "service/voice/pipeline.py (_persist_transcript)", "status": "confirmed"}], "edges": [{"from": "ans", "to": "ear", "label": "audio starts", "status": "confirmed"}, {"from": "ear", "to": "turn", "label": "sends words", "status": "confirmed"}, {"from": "turn", "to": "brain", "label": "sends turn", "status": "confirmed"}, {"from": "brain", "to": "mouth", "label": "sends text", "status": "confirmed"}, {"from": "mouth", "to": "end", "label": "then waits", "status": "confirmed"}, {"from": "end", "to": "save", "label": "saves chat", "status": "confirmed"}]}], "story": [{"heading": "What already works", "text": "A caller can talk to an agent in the browser (WebRTC) or over a phone line (Vobiz). The voice server listens, decides when the caller has finished, asks the same agent engine that chat uses, and speaks the answer sentence by sentence. The caller can interrupt. The agent opens with the agent's greeting. When the call ends, the whole conversation is saved."}, {"heading": "Indian languages", "text": "The speech code knows ten languages: Hindi, Tamil, Telugu, Kannada, Malayalam, Bengali, Marathi, Gujarati, Punjabi and English (India). If no language is set, ElevenLabs detects it, and the agent's rules tell it to answer in the caller's language. What is not shown anywhere: how accurate it is on real Indian calls. Also, the console lets you pick Sarvam or Deepgram for speech, but the voice server only accepts ElevenLabs. Picking Sarvam in the console would not work on a call, and what the call does then was not read. Sarvam is used elsewhere for WhatsApp voice-note transcription in echo-sdk, not for calls."}, {"heading": "Using our tools on a call", "text": "The call gets the agent's connected tools, knowledge bases and custom tools. Cards and buttons are switched off, since a caller cannot tap them. The caller's phone number is saved in the session, but nothing reads it back. The call uses a random guest identity, so tools that need to know who is calling get no mobile number from caller ID. A voice flag is sent to the tool server, but no code in the two tool repos reads it. In-chat login by OTP uses cards, so it is not designed for a call."}, {"heading": "Handing over to a human", "text": "This is not built. A call ends only by silence (10 seconds), the 10 minute limit, or the caller hanging up. The reply to Vobiz only opens an audio stream and has no 'forward the call' step. For chat, the console has a 'Messenger' product where people answer in an inbox, but how an agent would pass a conversation to it was not found. A search of all eight repos for handover, transfer and escalation found nothing for people."}, {"heading": "Things to know before building", "text": "The voice rules are written for a medical assistant: they limit the agent to 3 or 4 questions and then a recommendation, which suits triage but not a front-desk receptionist. These rules and the Haiku model are fixed in code for every voice agent. The console also stores a separate voice prompt, but the voice server never reads it. The matrix voice guide describes an older audio format and is out of date. The telephony route looks half-finished: the console's phone-number channel is a stub, and code comments say 'if telephony is revived'."}], "terms": [{"term": "STT / TTS", "meaning": "Speech-to-text (the ear) and text-to-speech (the mouth)."}, {"term": "WebRTC", "meaning": "The browser's way to send live audio. Used for the browser voice button."}, {"term": "Pipecat", "meaning": "The library that chains ear, brain and mouth into one live pipeline."}, {"term": "VAD (voice activity detection)", "meaning": "Detects when someone is speaking or has stopped."}, {"term": "Barge-in", "meaning": "The caller talking over the bot so it stops and listens."}, {"term": "MCP", "meaning": "The standard way our agent calls tools such as booking."}, {"term": "Session", "meaning": "One conversation record, used for chat and for every call."}, {"term": "Elicitation", "meaning": "Cards and buttons that ask the user to pick something. Switched off on voice."}, {"term": "Vobiz", "meaning": "The phone company service that connects calls to our server."}], "ripple": [{"change": "Add Sarvam (or Deepgram) for speech", "affects": "providers.py needs a new branch, the Literal types in matrix's agent_config.py, the language map and echo tuning in config/voice.py. The console already stores the settings.", "status": "confirmed"}, {"change": "Add handover to a person on the phone", "affects": "A transfer step in the call flow (pipeline.py and the Vobiz reply), a tool or rule telling the agent when to hand over, and agreement with the phone provider on forwarding.", "status": "guess"}, {"change": "Add handover to chat or an inbox", "affects": "The Messenger product and inbox in dev-console, plus a way for matrix to pass the conversation. How they join is not known.", "status": "guess"}, {"change": "Use the caller's number to identify them", "affects": "voice.py (/answer), the guest identity it creates, the Trinity lookup in user_context_utils.py, and the headers sent to the tool server.", "status": "guess"}, {"change": "Change the voice prompt rules or the model", "affects": "Every voice agent, because they are fixed in code (_build_agent and config/voice.py), not set per agent.", "status": "confirmed"}], "unknown": ["Whether phone calls are live in production, and how many numbers are set up.", "Whether Vobiz supports forwarding a live call to a person, and how.", "How accurate speech recognition and voices are on real Indian-language calls, and the cost per minute.", "What the call does when the voice settings do not load, for example when Sarvam is chosen.", "How browser voice users are logged in, and how tools get their identity there.", "Whether a tool server reads the voice flag or caller details in code outside the repos we read.", "How the Messenger inbox works and whether an agent can pass a chat to it.", "Matrix tests for voice and the widget's voice code were only skimmed. Nothing was run."], "next": ["matrix/med_assist/service/voice/pipeline.py: the full call flow, where handover and call end would be added.", "matrix/med_assist/router/voice.py: the phone answer address and caller identity.", "dev-console/integration/ (webhooks, schemas, Messenger product): how a person-run inbox is set up.", "eka-remote-mcp: whether any tool could act on the voice flag or caller number.", "Ask a developer: is Vobiz live, and can it forward calls?"], "sources": "Read on 2026-10-29. matrix 6f56888 (voice router, voice_ws, pipeline, providers, agent_processor, config/voice.py, agent_config_utils, user_context_utils, agent_utils; the two voice guides were only used to find files); dev-console ae25fd6 (voice schemas, AgentVoiceConfig, integration constants, webhooks); synapse-sdk d3c8268 (core VoiceAgent, widget voice hook; skimmed); echo-sdk 78c1048 (audio transcription, skimmed); doot 36e7eeb (voice notes, skimmed); eka-remote-mcp 012545e and eka-mcp-sdk (searched for voice and handover). Nothing was run."}</script>

  function row(k,v,code){if(!v)return;dl.appendChild(h('dt',{},k));var dd=h('dd');if(code)dd.appendChild(h('code',{},v));else dd.textContent=v;dl.appendChild(dd)}
  row('What it does',n.job);row('Where it lives',n.where,true);
  var st=n.status||'confirmed';dl.appendChild(h('dt',{},'How sure'));var dd=h('dd');dd.appendChild(h('span',{'class':'badge b-'+st},STAT[st]));dl.appendChild(dd);
  row('More',n.details);c.appendChild(dl);
}

function drawTabs(){
  var t=$('tabs');while(t.firstChild)t.removeChild(t.firstChild);
  D.views.forEach(function(v,i){var b=h('button',{role:'tab','aria-selected':String(i===view)},v.label);
    b.addEventListener('click',function(){view=i;sel=null;draw()});t.appendChild(b)});
  $('cap').textContent=D.views[view].caption||'';
}

function drawText(){
  $('title').textContent=D.title;document.title=D.title;$('answer').textContent=D.answer;$('analogy').textContent=D.analogy||'';
  var s=$('story');while(s.firstChild)s.removeChild(s.firstChild);
  (D.story||[]).forEach(function(x){if(x.heading)s.appendChild(h('h2',{},x.heading));s.appendChild(h('p',{},x.text))});
  var terms=D.terms||[];show('terms-s',terms.length>0);var tl=$('terms');while(tl.firstChild)tl.removeChild(tl.firstChild);
  terms.forEach(function(x){tl.appendChild(h('dt',{},x.term));tl.appendChild(h('dd',{},x.meaning))});
  var rp=D.ripple||[];show('ripple-s',rp.length>0);var tb=$('ripple');while(tb.firstChild)tb.removeChild(tb.firstChild);
  if(rp.length){var hr=h('tr');['If you change','These are affected','How sure'].forEach(function(x){hr.appendChild(h('th',{},x))});tb.appendChild(hr);
    rp.forEach(function(x){var r=h('tr');r.appendChild(h('td',{},x.change));r.appendChild(h('td',{},x.affects));var td=h('td');td.appendChild(h('span',{'class':'badge b-'+(x.status||'guess')},(x.status||'guess')));r.appendChild(td);tb.appendChild(r)})}
  function list(id,sid,arr){show(sid,arr&&arr.length);var el=$(id);while(el.firstChild)el.removeChild(el.firstChild);(arr||[]).forEach(function(x){el.appendChild(h('p',{},x))})}
  list('unknown','unknown-s',D.unknown);list('next','next-s',D.next);
  $('src').textContent=D.sources||'';
}
function draw(){drawTabs();drawSvg();drawCard()}
$('m-plain').addEventListener('click',function(){mode='plain';$('m-plain').setAttribute('aria-pressed','true');$('m-tech').setAttribute('aria-pressed','false');draw()});
$('m-tech').addEventListener('click',function(){mode='tech';$('m-tech').setAttribute('aria-pressed','true');$('m-plain').setAttribute('aria-pressed','false');draw()});
drawText();draw();
})();
</script>
</body>
</html>
