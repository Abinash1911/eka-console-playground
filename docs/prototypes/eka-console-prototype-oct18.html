/* ---------------- text processing ---------------- */
function chunkText(t,max=650){
  const paras=String(t).replace(/\r/g,'').split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  const out=[];let cur='';
  for(const p of paras){
    if(p.length>max){
      if(cur){out.push(cur);cur=''}
      const sents=p.match(/[^.!?]+[.!?]*\s*/g)||[p];let b='';
      for(const s of sents){if((b+s).length>max&&b){out.push(b.trim());b=''}b+=s}
      if(b.trim())out.push(b.trim());
    }else if(cur&&(cur+'\n\n'+p).length>max){out.push(cur);cur=p}
    else cur=cur?cur+'\n\n'+p:p;
  }
  if(cur)out.push(cur);
  return out.map(text=>({text}));
}
function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
    else c+=ch;
  }
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows;
}
const STOP=new Set('a an the is are was were of to in on for and or do does did i can my me you your what how when where which who it be with at by from this that will should have has there any if about am we our us please tell need want get'.split(' '));
const stem=w=>w.length>4?w.replace(/(ing|ed|es|s)$/,''):w;
const toks=s=>(String(s).toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w)&&w.length>1).map(stem);
function search(kbIds,query,k=3){
  const qt=[...new Set(toks(query))];if(!qt.length)return [];
  const all=[];
  S.kbs.filter(kb=>kbIds.includes(kb.id)).forEach(kb=>kb.sources.filter(s=>s.status==='ready').forEach(s=>s.chunks.forEach(c=>{
    all.push({c,src:s,kb,tk:toks(c.text),qk:c.q?new Set(toks(c.q)):null});})));
  const N=all.length||1,df={};
  all.forEach(x=>new Set(x.tk).forEach(t=>df[t]=(df[t]||0)+1));
  return all.map(x=>{let sc=0,hit=0;
    qt.forEach(t=>{const tf=x.tk.filter(y=>y===t).length;
      if(tf){hit++;sc+=Math.log(1+N/(1+(df[t]||0)))*(1+Math.log(tf))}
      if(x.qk&&x.qk.has(t))sc+=1.2;});
    return {...x,score:sc,hit,cover:hit/qt.length};
  }).filter(x=>x.hit>0).sort((a,b)=>b.score-a.score).slice(0,k);
}
function bestSentences(text,query,n=2){
  const q=new Set(toks(query));
  const sents=text.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+/g)||[text];
  return sents.map((s,i)=>({s:s.trim(),i,sc:toks(s).filter(t=>q.has(t)).length})).sort((a,b)=>b.sc-a.sc).slice(0,n).sort((a,b)=>a.i-b.i).map(x=>x.s).join(' ');
}
function reply(agent,text){
  const t=text.trim().toLowerCase();
  if(/^(hi|hello|hey|namaste|good (morning|evening|afternoon))\b/.test(t))return {text:agent.first};
  if(/^(thanks|thank you|ok thanks|great)\b/.test(t))return {text:'You are welcome. Anything else I can help with?'};
  const active=agent.kbs.filter(id=>!(agent.kbOff||[]).includes(id));
  if(!active.length)return {text:'No knowledge base is connected to me yet, so I can only follow my instructions. Connect one in the Knowledge Base tab.'};
  const hits=search(active,text,3),top=hits[0];
  if(!top||(top.cover<0.4&&top.hit<2))return {text:'I could not find that in my knowledge, so I will not guess. Would you like me to connect you to the front desk?'};
  const body=top.c.a?top.c.a:bestSentences(top.c.text,text);
  return {text:body,srcs:[...new Set(hits.filter(h=>h.score>=top.score*.6).map(h=>h.kb.name+' · '+h.src.title))]};
}

function loadScript(u){return libs[u]||(libs[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('Could not load the file parser. Check your connection and try again.'));document.head.appendChild(s)}))}
async function extract(file,type){
  const name=file.name.toLowerCase();
  if(type==='pdf'||name.endsWith('.pdf')){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let out='';
    for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out+=tc.items.map(x=>x.str).join(' ')+'\n\n'}
    if(out.replace(/\s/g,'').length<20)throw new Error('No readable text found. This looks like a scanned PDF, which needs OCR.');
    return {text:out,meta:pdf.numPages+(pdf.numPages>1?' pages':' page')};
  }
  if(name.endsWith('.docx')){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return {text:r.value,meta:'Word document'};
  }
  const raw=await file.text();
  if(/\.html?$/.test(name)){const d=new DOMParser().parseFromString(raw,'text/html');d.querySelectorAll('script,style').forEach(x=>x.remove());return {text:d.body.innerText||d.body.textContent,meta:'HTML'}}
  if(name.endsWith('.json')){try{return {text:JSON.stringify(JSON.parse(raw),null,2),meta:'JSON'}}catch(e){throw new Error('That JSON file is not valid.')}}

}

    <td class="px-4 py-3">${ed?`<input type="datetime-local" data-nde="expires_at" value="${esc(er.expires_at)}" class="${ei} text-xs">`:`<span class="text-xs text-gray-500">${r.expires_at?r.expires_at.slice(0,10):'—'}</span>`}</td>
    ${rule?`<td class="px-4 py-3 text-right">${ed?`<div class="flex gap-1 justify-end"><button data-ndx="esv" class="px-2.5 py-1 bg-indigo-600 text-white text-xs font-medium rounded hover:bg-indigo-700 transition-colors">Save</button><button data-ndx="ecx" class="px-2.5 py-1 border border-gray-300 text-gray-600 text-xs font-medium rounded hover:bg-gray-50 transition-colors">Cancel</button></div>`:`<button data-ndx="estart" data-id="${r.id}" class="p-1.5 hover:bg-indigo-100 rounded text-gray-400 hover:text-indigo-600 transition-colors" aria-label="Edit">${I('pencil','w-3.5 h-3.5')}</button>`}</td>`:''}</tr>`}).join('')}</tbody></table>
    <div class="flex items-center justify-between px-1 pt-4"><p class="text-sm text-gray-500">Page ${U.page} of ${tp} (${total} entries)</p><div class="flex gap-2"><button data-ndx="prev" ${U.page<=1?'disabled':''} class="inline-flex items-center gap-1 px-3 py-1.5 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">${I('chevron-left')} Prev</button><button data-ndx="next" ${U.page>=tp?'disabled':''} class="inline-flex items-center gap-1 px-3 py-1.5 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Next ${I('chevron-right')}</button></div></div></div>`

}
HOOKS.click.push(e=>{
  if(ndUI.menu&&!e.target.closest('[data-ndx="menu"],[data-ndmenu]')){ndUI.menu=null;if(view.name==='nudge'){const t0=e.target.closest('[data-ndx]');if(!t0||t0.dataset.ndx==='open'){render();}}}
  const t=e.target.closest('[data-ndx]');if(!t||!['nudge','nudge-agent'].includes(view.name))return false;
  const a=t.dataset.ndx,id=t.dataset.id,U=ndUI;
  const fnd=agentId=>S.ndRows[agentId]||(S.ndRows[agentId]=[]);
  switch(a){
    case 'open':U.menu=null;go('nudge-agent',id);return true;
    case 'menu':{const r=t.getBoundingClientRect();U.pos={top:r.bottom+8,left:Math.max(8,r.right-192)};U.menu=U.menu===id?null:id;render();return true}
    case 'edit':{const c=S.ndCfg[id];U.menu=null;U.edit={id,form:{max:c.max,delay:c.delay,ttl:c.ttl}};render();return true}
    case 'eclose':U.edit=null;render();return true;
    case 'esave':{const f=U.edit.form,c=S.ndCfg[U.edit.id];c.max=Math.min(150,Math.max(10,+f.max||70));c.delay=Math.max(0,+f.delay||0);c.ttl=Math.max(1,+f.ttl||1);U.edit=null;save();render();return true}
    case 'remove':U.menu=null;if(confirm('Remove nudge configuration for this agent?')){delete S.ndCfg[id];save()}render();return true;
    case 'csv':{const a2=agentOf(view.id),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',L=[['Domain','URL Path','Nudge Text','Source','Expires At','Created At'].join(',')].concat(fnd(a2.id).map(r=>[r.domain,r.url_path,r.nudge_text,r.source,r.expires_at,r.expires_at].map(q).join(',')));
      try{const u=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='nudges_'+a2.alias+'.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}catch(_){}return true}
    case 'aopen':U.add=true;U.err='';U.rows=[{domain:'',url_path:'',nudge_text:''}];render();return true;
    case 'aclose':U.add=false;render();return true;
    case 'aadd':U.rows.push({domain:'',url_path:'',nudge_text:''});render();return true;
    case 'arem':U.rows.splice(+t.dataset.i,1);render();return true;
    case 'asave':{const valid=U.rows.filter(r=>r.domain.trim()&&r.nudge_text.trim());if(!valid.length){U.err='Domain and Nudge Text are required for each row.';render();return true}
      const c=S.ndCfg[view.id],list=fnd(view.id);valid.forEach(r=>list.unshift({id:uid('n'),domain:r.domain.trim(),url_path:r.url_path.trim(),nudge_text:r.nudge_text.trim(),source:'manual',expires_at:new Date(Date.now()+c.ttl*36e5).toISOString()}));U.add=false;U.err='';U.page=1;save();render();return true}
    case 'estart':{const r=fnd(view.id).find(x=>x.id===id);U.editId=id;U.editRow={domain:r.domain,url_path:r.url_path,nudge_text:r.nudge_text,expires_at:(r.expires_at||'').slice(0,16)};render();return true}
    case 'ecx':U.editId=null;render();return true;
    case 'esv':{const r=fnd(view.id).find(x=>x.id===U.editId),er=U.editRow;if(r){r.domain=er.domain;r.url_path=er.url_path;r.nudge_text=er.nudge_text;if(er.expires_at)r.expires_at=new Date(er.expires_at).toISOString()}U.editId=null;save();render();return true}
    case 'bdel':if(confirm('Delete '+U.sel.length+' nudge(s)?')){S.ndRows[view.id]=fnd(view.id).filter(r=>!U.sel.includes(r.id));U.sel=[];save()}render();return true;
    case 'prev':U.page--;render();return true;
    case 'next':U.page++;render();return true;
  }
  return false;
});
HOOKS.input.push(e=>{
  const t=e.target,d=t.dataset;
  if(d.ndf&&ndUI.edit){ndUI.edit.form[d.ndf]=t.value;return true}
  if(d.ndr){const [i,k]=d.ndr.split(':');ndUI.rows[+i][k]=t.value;return true}
  if(d.nde&&ndUI.editRow){ndUI.editRow[d.nde]=t.value;return true}
  return false;
});
HOOKS.change.push(e=>{
  const t=e.target,d=t.dataset;
  if(d.ndsel!==undefined){const i=ndUI.sel.indexOf(d.ndsel);if(i>=0)ndUI.sel.splice(i,1);else ndUI.sel.push(d.ndsel);render();return true}

  return false;
});
HOOKS.submit.push(e=>{
  if(e.target.id!=='nd-cfg-form')return false;e.preventDefault();
  const fd=new FormData(e.target),id=fd.get('agent_id');if(!id||!agentOf(id))return true;
  S.ndCfg[id]={type:'rule',delay:Math.max(0,+fd.get('delay')||0),ttl:Math.max(1,+fd.get('ttl_hours')||8760),max:Math.min(150,Math.max(10,+fd.get('max_length')||70))};save();go('nudge');return true;
});
HOOKS.keydown.push(e=>{if(e.key==='Escape'&&view.name==='nudge'&&(ndUI.edit||ndUI.menu)){ndUI.edit=null;ndUI.menu=null;render();return true}return false});

go:`package main

import (
	"encoding/base64"
	"fmt"
	"time"

	"github.com/golang-jwt/jwt/v5"
	"github.com/google/uuid"
)

func mintPartnerToken() (string, error) {
	kid := "kid_v1"
	secret := "dGVzdHNlY3JldGtleWZvcmp3ZXRlc3QxMjM0NTY3ODk"

	// HMAC key = raw bytes of the base64url secret
	key, err := base64.RawURLEncoding.DecodeString(secret)
	if err != nil {
		return "", err
	}

	now := time.Now()
	token := jwt.NewWithClaims(jwt.SigningMethodHS256, jwt.MapClaims{
		"iss":    "https://partner.example.com",
		"aud":    "https://eka.care",
		"sub":    "", // your partner user id (empty ⇒ use mobile)
		"mobile": "+919876543210",
		"iat":    now.Unix(),
		"exp":    now.Add(5 * time.Minute).Unix(),
		"jti":    uuid.NewString(),
	})
	token.Header["kid"] = kid

	return token.SignedString(key)
}

func main() {
	token, err := mintPartnerToken()
	if err != nil {
		panic(err)
	}
	fmt.Println(token)
}`,
java:`import org.jose4j.jws.JsonWebSignature;
import org.jose4j.jws.AlgorithmIdentifiers;
import org.jose4j.jwt.JwtClaims;
import org.jose4j.keys.HmacKey;

import java.util.Base64;

public class GenerateJWT {

    public static void main(String[] args) throws Exception {

        String kid = "kid_v1";
        String secret = "dGVzdHNlY3JldGtleWZvcmp3ZXRlc3QxMjM0NTY3ODk";

        // HMAC key = raw bytes of the base64url secret
        byte[] keyBytes = Base64.getUrlDecoder().decode(secret);

        JwtClaims claims = new JwtClaims();
        claims.setIssuer("https://partner.example.com");
        claims.setAudience("https://eka.care");
        claims.setSubject("");                  // partner user id (empty ⇒ use mobile)
        claims.setClaim("mobile", "+919876543210");
        claims.setIssuedAtToNow();
        claims.setExpirationTimeMinutesInTheFuture(5);
        claims.setGeneratedJwtId();

        JsonWebSignature jws = new JsonWebSignature();
        jws.setPayload(claims.toJson());
        jws.setAlgorithmHeaderValue(AlgorithmIdentifiers.HMAC_SHA256);
        jws.setKeyIdHeaderValue(kid);
        jws.setKey(new HmacKey(keyBytes));

        System.out.println(jws.getCompactSerialization());
    }
}`};

function submitTpl(){

    if(S.wa.some(w=>w.number.replace(/\D/g,'').endsWith(ph))||ph==='9876543210'){metaState={s:'already',msg:''};return render()}

function sendPv(text){

    case 'ds-clear':dsq.q='';return render();
    case 'ds-save':{const p=panel,sc=DSS[p.slug],e=DSE[p.slug],rows=S.ds.rows[p.slug],vals={},errs={};
      sc.f.forEach(f=>{const el=$('#dsf-'+f[0]);vals[f[0]]=el?el.value.trim():(p.vals[f[0]]||'')});
      sc.f.forEach(f=>{if(f[3]&&!vals[f[0]])errs[f[0]]='This field is required.'});
      if(sc.id&&vals[sc.id]&&!p.edit&&rows.some(r=>r[sc.id]===vals[sc.id]))errs[sc.id]='A '+e.o.toLowerCase()+' with this ID already exists in the default knowledge base.';
      if(Object.keys(errs).length){p.vals=vals;p.errs=errs;return paintPanel()}
      if(p.edit){Object.assign(rows.find(r=>r._id===p.edit),vals)}else rows.unshift(Object.assign({_id:uid('r'),is_active:true},vals));
      save();closePanel();render();return showToast(e.o+(p.edit?' updated.':' created.'))}
    case 'invite-add':{const id=randHex(6),link='https://console.eka.care/invite/'+id;S.invites.unshift({id:uid('i'),link,type:'Member',status:'Active',created:Date.now()});save();render();navigator.clipboard&&navigator.clipboard.writeText(link).catch(()=>{});return showToast('Invite link created')}
    case 'settings-save':save();return showToast('Settings saved');
    case 'scribe-save':{const ph2=($('#scph').value||'').trim();if(!/^\d{10}$/.test(ph2))return showToast('Enter a 10-digit mobile number','error');S.scribe.phone=ph2;S.scribe.template=$('#sct').value;save();return showToast('Number verified and saved')}
    case 'eval-compare':{const n=document.querySelectorAll('[data-evsel]:checked').length;return showToast(n===2?'In the real console this opens a side-by-side comparison':'Select exactly 2 runs to compare',n===2?'info':'error')}
    case 'side':collapsed=!collapsed;return paintSide(),icons();
    case 'add-quick':agentOf(view.id).quick.push({label:'',value:''});save();return render();
    case 'save-agent':{const a=agentOf(view.id);a.updated=Date.now();save();delete chats[a.id+':web'];delete chats[a.id+':wa'];paintWidget();return showToast('It may take a minute for changes to sync')}
    case 'kbconnect':{const v=$('#kbsel').value;if(!v)return;const a=agentOf(view.id);a.kbs.push(v);save();return render()}
    case 'toolconnect':{const v=$('#toolsel').value;if(!v)return;agentOf(view.id).tools.push(v);save();return render()}
    case 'new-kb':{const kb={id:uid('kb_'),name:'New knowledge base',desc:'',created:Date.now(),updated:Date.now(),sources:[]};S.kbs.unshift(kb);save();add=null;return go('kb',kb.id,'details')}
    case 'save-kb':{const kb=kbOf(view.id);const n=$('#kbn').value.trim();if(!n)return showToast('Name is required','error');kb.name=n;kb.desc=$('#kbd').value.trim();kb.updated=Date.now();save();render();return showToast('Knowledge base saved')}
    case 'kbagent-on':{const v=$('#agsel').value;if(!v)return;agentOf(v).kbs.push(view.id);save();return render()}
    case 'panel-close':return closePanel();
    case 'panel-reset':panel.files=[];panel.err='';return paintPanel();
    case 'panel-add-files':return addFiles();
    case 'panel-add-site':return addSite();
    case 'panel-add-text':return addText();
    case 'panel-add-qa':return addQA();
    case 'panel-q-add':panel.qs=(panel.qs&&panel.qs.length?panel.qs:['']).concat(['']);return paintPanel();
    case 'bulk-toggle':sq.bulk=!sq.bulk;sq.sel=[];return render();
    case 'bulk-delete':{const kb=kbOf(view.id);kb.sources=kb.sources.filter(x=>!sq.sel.includes(x.id));sq.sel=[];sq.bulk=false;save();render();return showToast('Sources deleted')}
    case 'wopen':w.open=true;return paintWidget();
    case 'wclose':w.open=false;return paintWidget();
    case 'wreset':delete chats[chatKey(agentOf(view.id))];return paintWidget();
    case 'consent-yes':{const a=agentOf(view.id),cs=chatState(a);cs.ok=true;cs.msgs.push({r:'u',t:'Accept',time:hhmm()},{r:'b',t:a.first,time:hhmm()});return paintWidget()}
    case 'consent-no':{const a=agentOf(view.id),cs=chatState(a);cs.msgs.push({r:'u',t:'Decline',time:hhmm()},{r:'b',t:'No problem. We have not stored anything. You can message us again any time.',time:hhmm()});return paintWidget()}
    case 'wa-add':{const nw={id:uid('w'),name:'New integration',number:'+91 98xxx '+Math.floor(10000+Math.random()*89999),status:'Pending',provider:'EkaAgents',agent:'',consent:false,consentText:''};S.wa.push(nw);save();render();setTimeout(()=>{nw.status='Active';save();showToast('WhatsApp number is active','success');if(['home','whatsapp','integration'].includes(view.name))render()},6000);return showToast('Integration added. The real console opens Meta Embedded Signup here.','info')}
  }
});
document.addEventListener('input',e=>{
  for(const h of HOOKS.input)if(h(e)===true)return;
  const t=e.target;
  if(t.dataset.bind&&view.name==='agent'){const a=agentOf(view.id);a[t.dataset.bind]=t.dataset.bind==='idle'?+t.value:t.value;save()}
  if(t.dataset.q){agentOf(view.id).quick[+t.dataset.i][t.dataset.q]=t.value;save()}
  if(t.dataset.faq&&add)add.rows[+t.dataset.i][t.dataset.faq]=t.value;
  if(t.dataset.wactext){S.wa.find(x=>x.id===t.dataset.wactext).consentText=t.value;save()}
  if(panel){if(t.id==='ptl')panel.title=t.value;if(t.id==='purl')panel.url=t.value;if(t.id==='plq'){panel.lq=t.value;paintPanel();const q=$('#plq');q&&q.focus();q&&q.setSelectionRange(99,99)}if(t.dataset.pq!==undefined){panel.qs=panel.qs||[''];panel.qs[+t.dataset.pq]=t.value}if(t.id==='ptext'||t.id==='pans'){panel[t.id]=t.innerHTML;updCount()}}
  if(t.id==='cin'){const b=t.form&&t.form.querySelector('[data-sendbtn]'),a0=agentOf(view.id);if(b&&a0){const on=t.value.trim().length>0;b.style.background=on?a0.accent:a0.accent+'66';b.style.color='#fff'}}
  if(t.id==='sq'){sq.q=t.value;refreshSources()}
  if(tplForm){if(t.dataset.tpl!==undefined)tplForm[t.dataset.tpl]=t.value;if(t.dataset.tplhs!==undefined)tplForm.hs[+t.dataset.tplhs]=t.value;if(t.dataset.tplbs!==undefined)tplForm.bs[+t.dataset.tplbs]=t.value}
});
document.addEventListener('change',e=>{
  for(const h of HOOKS.change)if(h(e)===true)return;
  const t=e.target,d=t.dataset;
  if(d.allow){agentOf(view.id).allowed[d.allow]=t.checked;save()}
  if(d.kbload){const a=agentOf(view.id);a.kbOff=(a.kbOff||[]).filter(x=>x!==d.kbload);if(!t.checked)a.kbOff.push(d.kbload);save()}
  if(d.llm){const a=agentOf(view.id);a.llm[d.llm]=t.type==='number'?+t.value:t.value;save()}
  if(d.dm){agentOf(view.id).display=d.dm;w.open=false;save();render()}
  if(d.mm){agentOf(view.id).mobile=d.mm;pv.open=false;save();render()}
  if(d.walink){S.wa.find(x=>x.id===d.walink).agent=t.value;save();delete chats[(t.value||'')+':wa']}
  if(d.waconsent){S.wa.find(x=>x.id===d.waconsent).consent=t.checked;save();render()}
  if(t.id==='signin'&&t.value){const v=t.value;S.clock=(S.clock||0)+(v==='day'?864e5:v==='week'?6048e5:0);save();t.value='';reminderShown=false;go('home');setTimeout(checkReminder,250);return}
  if(tplForm&&t.dataset.tpl!==undefined){tplForm[t.dataset.tpl]=t.value;if(['body','header'].includes(t.dataset.tpl))render();return}
  if(t.id==='pfiles')return setFiles(t.files);
  if(t.id==='pbulk'&&t.files[0])return bulkQA(t.files[0]);
  if(t.id==='scat'){sq.cat=t.value;return refreshSources()}
  if(t.id==='ssort'){sq.sort=t.value;return refreshSources()}
  if(d.setOn){S.settings[d.setOn].on=t.checked;save();return render()}
  if(d.setVal){S.settings[d.setVal].val=+t.value||1;save()}
  if(d.setUnit){S.settings[d.setUnit].unit=t.value;save()}
  if('setImprove' in d){S.settings.improve=t.checked;save()}
  if(d.nudgeActive){const e=(S.nudgeEntries[view.id]||[]).find(x=>x.id===d.nudgeActive);if(e){e.active=t.checked;save()}}
  if(t.id==='convag'){convAgent=t.value;return render()}
  if(t.id==='vg'){vf.g=t.value;return render()}
  if(t.id==='vl'){vf.l=t.value;return render()}
  if(t.id==='vq'){vf.q=t.value;return render()}
  if(t.id==='dscsv'&&t.files[0])return t.files[0].text().then(dsReadCSV);
});
document.addEventListener('submit',e=>{
  for(const h of HOOKS.submit)if(h(e)===true)return;
  e.preventDefault();const id=e.target.id;
  if(id==='pform'){const i=$('#pin'),v=i.value;i.value='';sendPv(v);return}
  if(id==='dsq'){dsq.q=$('#dsqi').value;return render()}
  if(id==='cform'){const i=$('#cin'),v=i.value;i.value='';send(v)}
  if(id==='rform'){const kb=kbOf(view.id),items=search([kb.id],$('#rq').value,4);lastResults={kb:kb.id,items};$('#rresults').innerHTML=resultsHTML(items)}
  if(id.startsWith('f-')&&id!=='f-err')return submitModule(id.slice(2));
  if(id==='newagent'){const n=$('#na-name').value.trim();if(!n){const er=$('#na-err');er.textContent='Give your agent a name.';er.classList.remove('hidden');return}
    const a={id:uid('ag_'),alias:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),name:n,created:Date.now(),updated:Date.now(),accent:'#215fff',first:$('#na-first').value.trim()||'Hi, how can I help you today?',prompt:$('#na-prompt').value.trim()||'You are a helpful assistant. Answer only from the connected knowledge.',quick:[],allowed:{text:true,file:false,audio:false,voice:false},idle:60,kbs:[],kbOff:[],tools:[],llm:{model:'Claude Haiku',temp:0.3,tokens:1024,iter:6},display:'widget'};
    S.agents.unshift(a);save();showToast('Agent created');go('agent',a.id,'general')}
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  const d=e.target.closest&&e.target.closest('#pdrop');if(!d)return;e.preventDefault();
  d.classList.toggle('border-indigo-400',ev==='dragover');
  if(ev==='drop'&&panel&&panel.kind==='file')setFiles(e.dataTransfer.files);
}));
document.addEventListener('keydown',e=>{for(const h of HOOKS.keydown)if(h(e)===true)return;if(e.key==='Escape'){if(panel)closePanel();else if(w.open&&view.name==='agent'){w.open=false;paintWidget()}}});
window.addEventListener('resize',()=>{const c=window.innerWidth<768;if(c!==collapsed&&c){collapsed=true;paintSide();icons()}});
{const q=new URLSearchParams(location.search).get('scenario');if(['new','mid','live','issues'].includes(q))loadScenario(q)}
mergeExtraSeed();render();
setTimeout(checkReminder,700);
})();
</script>
