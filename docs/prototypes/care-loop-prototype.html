<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Care Loop Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: left rail for the clinic console, centre for EMR / Scribe / workflows, right for the patient's WhatsApp. One state, three surfaces. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#12161C; --ink-2:#3A4250; --muted:#667085; --faint:#98A2B3;
  --line:#E3E6EB; --line-2:#EEF0F3;
  --accent:#1D5FD8; --accent-ink:#0F3F9E; --accent-wash:#EDF3FE;
  --good:#16784A; --good-wash:#E8F5EE; --warn:#9A6200; --warn-wash:#FFF4DC; --crit:#B42318; --crit-wash:#FDECEA;
  --wa:#008069; --wa-out:#D9FDD3; --wa-bg:#EFEAE2; --ticks:#53BDEB;
  --font:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:216px minmax(0,1fr) 372px;gap:28px;max-width:1500px;margin:0 auto;padding-block:20px;align-items:start}

/* Rail */
.rail{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left;position:relative}
.nav button:hover{background:#ECEEF2}
.nav button[aria-current="page"]{background:var(--accent-wash);color:var(--accent-ink)}
.badge{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.rail small{color:var(--muted);font-size:12px;line-height:1.5;display:block}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-weight:500;font-size:12px;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* Main */
main{min-width:0;position:relative}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.022em;line-height:1.2;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:62ch}
h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;font-size:13px;color:var(--ink);line-height:1.4}
.btn:hover{background:#F8F9FB}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.lg{padding:10px 16px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.why{color:var(--faint);font-size:12px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:#EEF0F3;color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-wash);color:var(--good)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.crit{background:var(--crit-wash);color:var(--crit)}
.chip.blue{background:var(--accent-wash);color:var(--accent-ink)}
.chip.wa{background:#E3F4EF;color:var(--wa)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* Workflows */
.targets{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field .pair{display:flex;align-items:center;gap:6px;color:var(--muted)}
.field input{width:72px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-variant-numeric:tabular-nums}
.field .unit{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.uc{display:flex;flex-direction:column;gap:10px}
.uc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.uc h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.uc p{margin:0;color:var(--ink-2);font-size:13px}
.uc dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:4px 8px;font-size:12px;color:var(--muted)}
.uc dt{font-weight:500}
.uc dd{margin:0;color:var(--ink-2)}
.uc .foot{margin-top:auto;padding-top:4px;display:flex;justify-content:space-between;align-items:center}
.uc.off{background:#FAFAFB}
.uc.off h3,.uc.off p{color:var(--faint)}
.sw{width:36px;height:20px;border-radius:10px;border:0;background:#CDD2DA;position:relative;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}

/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.hl td{background:var(--accent-wash)}
td b{font-weight:600}

/* Record */
.pt{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.av{width:48px;height:48px;border-radius:50%;background:#E5ECFB;color:var(--accent-ink);display:grid;place-items:center;font-weight:650;font-size:16px;flex:none}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.meta{display:flex;gap:6px 20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.meta b{color:var(--ink-2);font-weight:500}
.alert{border:1px solid #F1C7C2;background:var(--crit-wash);border-radius:12px;padding:14px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.alert.seen{background:var(--warn-wash);border-color:#F0DCA8}
.alert.done{background:var(--good-wash);border-color:#BFE0CF}
.alert strong{font-weight:600}
.alert .why{color:var(--ink-2);font-size:13px}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.empty{color:var(--muted);font-style:normal}
.stat{display:flex;gap:24px;flex-wrap:wrap}
.stat div b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat div span{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
.chart .gl line{stroke:var(--line-2)}
.chart text{font-size:14px;fill:var(--muted);font-family:var(--font)}
.chart .band{fill:#E8F5EE}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:#fff;stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .pt.hi{stroke:var(--crit)}
.chart .pt.last.hi{fill:var(--crit)}
.chart .lbl{font-weight:600;fill:var(--ink)}
.chart .bandlbl{fill:var(--good);font-weight:500}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.feed .src{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.feed li.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-wash)}to{background:transparent}}
.bul{margin:0;padding-left:18px;color:var(--ink-2)}
.bul li{margin:2px 0}

/* Journey */
.jrow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.jrow:last-child{border-bottom:0}
.jn{width:22px;height:22px;border-radius:50%;background:#EEF0F3;color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:650;flex:none}
.jrow.done .jn{background:var(--good-wash);color:var(--good)}
.jrow.cur .jn{background:var(--accent);color:#fff}
.jrow.upcoming .jt b,.jrow.upcoming .jt span{color:var(--faint)}
.jt{flex:1;min-width:0}
.jt b{display:block;font-size:13.5px;font-weight:600}
.jt span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.jstatus{flex:none}
.jstagelbl{margin:14px 0 2px}
.jrow:first-child,.jstagelbl:first-child+.jrow{}

/* Ops / KPI */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:12px}
.kpitile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpitile b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpitile span{font-size:12px;color:var(--muted)}
.kpitile.crit b{color:var(--crit)}
.kpitile.good b{color:var(--good)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;border-radius:4px 4px 0 0;background:var(--accent-wash)}
.bars .b em{font-style:normal;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}

/* Scribe */
.scribe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.tr{display:flex;flex-direction:column;gap:10px;min-height:320px;max-height:520px;overflow:auto}
.ln2{display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:13px}
.ln2 b{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);padding-top:2px}
.rec{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--crit)}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--crit);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.sec{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.sec:last-of-type{border-bottom:0}
.ed{outline:0;border-radius:6px;padding:4px 6px;margin:0 -6px;color:var(--ink-2)}
.ed:hover{background:#F5F6F8}
.ed:focus{background:var(--accent-wash)}
.rx td,.rx th{padding:8px 8px}
.ph-empty{color:var(--muted);padding:24px 0;text-align:center}

/* Phone */
.phonecol{position:sticky;top:20px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.pcap{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:340px}
.phone{width:100%;max-width:340px;height:660px;border-radius:40px;background:#161A20;padding:9px;box-shadow:0 18px 40px -18px rgba(16,24,40,.35),0 2px 6px rgba(16,24,40,.12)}
.screen{height:100%;border-radius:32px;overflow:hidden;background:var(--wa-bg);display:flex;flex-direction:column}
.status{background:var(--wa);color:#fff;display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:12px;font-weight:600}
.wh{background:var(--wa);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 14px 10px}
.wh .logo{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--wa);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.wh b{display:flex;gap:4px;align-items:center;font-weight:600;font-size:15px;line-height:1.2}
.wh span{font-size:12px;opacity:.85}
.wh .pills{margin-left:auto;display:flex;gap:5px;flex:none}
.wh .pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 7px}
.wh .pill i{width:5px;height:5px;border-radius:50%;background:#6CF2A4;display:inline-block}
.wh .pill.emr{background:#fff;color:#5B3FC9}
.flowbar{background:#00695A;padding:6px 14px 9px;flex:none}
.flowbar .lbl{color:#fff;font-size:10.5px;font-weight:600;margin-bottom:5px;opacity:.9}
.flowseg{display:flex;gap:3px}
.flowseg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);display:block;font-style:normal}
.flowseg i.on{background:#fff}
.chat{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.hint{align-self:center;background:#FFF6D6;color:#5E4B00;font-size:12px;border-radius:8px;padding:8px 12px;text-align:center;max-width:90%}
.day{align-self:center;background:#E1F0F7;color:#4B5B66;font-size:11px;border-radius:6px;padding:2px 8px;margin-bottom:2px}
.msg{max-width:84%;padding:6px 9px 4px;border-radius:9px;font-size:13.5px;line-height:1.4;box-shadow:0 1px 1px rgba(16,24,40,.12);word-wrap:break-word;overflow-wrap:anywhere;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.msg.in{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.msg.out{align-self:flex-end;background:var(--wa-out);border-top-right-radius:2px}
.msg .t{display:block;text-align:right;font-size:10.5px;color:#8A949C;margin-top:1px}
.msg.sys{align-self:center;background:none;box-shadow:none;color:#6B7680;font-size:12px;text-align:center;max-width:90%;padding:4px 10px}
.msg.out .t::after{content:" \2713\2713";color:var(--ticks);letter-spacing:-2px}
.msg .who{display:block;font-size:12px;font-weight:600;color:var(--accent-ink);margin-bottom:1px}
.msg .tpl{display:block;font-size:10.5px;color:#8A949C;margin-bottom:2px}
.msg ul{margin:4px 0 2px;padding-left:16px}
.msg ul li{margin:1px 0}
.tile{margin:-1px -2px 4px;border-radius:7px;background:repeating-linear-gradient(45deg,#E9E4DA,#E9E4DA 8px,#F1EDE4 8px,#F1EDE4 16px);height:96px;display:grid;place-items:end start;padding:6px 8px;font-size:12px;color:#5C5648}
.doc{display:flex;gap:8px;align-items:center;background:#F2F4F6;border-radius:7px;padding:8px;margin:2px 0 4px;font-size:12.5px}
.doc i{width:28px;height:34px;border-radius:4px;background:var(--crit);color:#fff;font-style:normal;font-size:9px;font-weight:700;display:grid;place-items:center}
.msg.typing{display:flex;gap:4px;padding:10px 12px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:#9AA3AB;animation:blink 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{40%{opacity:.25}}
.quick{display:flex;flex-direction:column;gap:4px;align-self:flex-start;width:84%}
.quick button{background:#fff;color:#0A7CFF;border:0;border-radius:9px;padding:8px 10px;font-weight:500;font-size:13.5px;box-shadow:0 1px 1px rgba(16,24,40,.12)}
.quick button:hover{background:#F0F7FF}
.safety{align-self:stretch;background:#fff;border-radius:10px;padding:11px;box-shadow:0 1px 1px rgba(16,24,40,.12);animation:pop .18s ease-out}
.safety .stitle{font-weight:600;font-size:13px;color:#1F2430;margin-bottom:8px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#FDEBEA;border-radius:8px;padding:8px;margin-bottom:9px}
.sgrid .si{font-size:11.5px;color:#6B3330;line-height:1.3;display:flex;align-items:center;gap:5px}
.sgrid .si i{width:6px;height:6px;border-radius:50%;background:#C0392B;flex:none;display:inline-block}
.sbtns{display:flex;flex-direction:column;gap:6px}
.sbtns button{border-radius:8px;padding:9px;font-weight:600;font-size:12.5px;border:1.5px solid}
.sbtns .syes{background:#C0392B;border-color:#C0392B;color:#fff}
.sbtns .sno{background:#fff;border-color:#008069;color:#008069}
.ssub{font-size:10px;color:#8A949C;text-align:center;margin-top:3px}
.billcard{align-self:stretch;background:#fff;border-radius:10px;padding:11px;box-shadow:0 1px 1px rgba(16,24,40,.12);animation:pop .18s ease-out}
.billcard .btitle{font-size:11px;color:#667085;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.billcard .bprice{font-size:22px;font-weight:700;color:#1F2430;margin:3px 0 7px}
.blist{margin:0 0 10px;padding-left:16px;font-size:12px;color:#3A4250}
.blist li{margin:2px 0}
.bpay{width:100%;background:#008069;color:#fff;border:0;border-radius:8px;padding:9px;font-weight:600;font-size:13px}
.inp{display:flex;gap:6px;padding:8px;background:#F0F2F5}
.inp input{flex:1;min-width:0;border:0;border-radius:20px;padding:8px 14px;background:#fff;font-size:13.5px}
.inp button{width:36px;height:36px;border-radius:50%;border:0;background:var(--wa);color:#fff;display:grid;place-items:center;flex:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;max-width:min(92vw,520px);z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{font-weight:600;color:#9CC0FF;margin-right:6px}
.foot-note{color:var(--muted);font-size:12px;margin-top:20px}

@media (max-width:1240px){
  .app{grid-template-columns:200px minmax(0,1fr);}
  .phonecol{position:static;grid-column:1 / -1;order:3}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .nav{flex-direction:row;overflow-x:auto;max-width:100%}
  .nav button{white-space:nowrap}
  .rail small,.rail .linkbtn{display:none}
  .cols,.scribe{grid-template-columns:minmax(0,1fr)}
  .alert .acts{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark"><svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg></div><div><b>Care Loop</b><span>Mehta Diabetes Clinic</span></div></div>
    <nav class="nav" id="nav" aria-label="Clinic console"></nav>
    <div>
      <small>Prototype with sample data. Nothing is sent or saved. Clinical text is illustrative, not advice.</small>
      <button class="linkbtn" id="reset" style="margin-top:8px">Reset demo</button>
    </div>
  </aside>

 {id:'yearly',s:3,t:'Yearly eye, foot and kidney checks',d:'Tracks annual screenings and books them before they lapse.',w:'Check due in 30 days',e:'Screening status',on:0},
 {id:'pay',s:4,t:'Payment link and receipt',d:'Sends the bill, takes UPI, returns a receipt in chat.',w:'Consult marked done',e:'Payment and receipt',on:1},
 {id:'feedback',s:4,t:'Visit feedback',d:'Asks how the visit went. Happy patients are invited to review, unhappy ones reach staff.',w:'Two hours after the visit',e:'Score, staff task if low',on:0},

/* ---------- State ---------- */

function fresh(){

    labs:[{d:'Jan 2026',v:8.4},{d:'Jun 2026',v:7.9}],

}
S=fresh();

/* ---------- Journey ---------- */
function vJourney(){
  const total=JOURNEY.length,doneN=S.jstep,done=doneN>=total;
  const rows=STAGES.map((stage,si)=>{
    const items=JOURNEY.map((id,gi)=>({id,gi})).filter(x=>UC.find(u=>u.id===x.id).s===si);
    if(!items.length)return '';
    return '<div class="eyebrow jstagelbl">'+stage+'</div>'+items.map(x=>{
      const u=UC.find(u=>u.id===x.id);
      const state=x.gi<doneN?'done':x.gi===doneN?'cur':'upcoming';
      const mark=state==='done'?'<svg class="ic" style="width:15px;height:15px;stroke:var(--good)" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>':state==='cur'?'<span class="chip blue">Up next</span>':'';
      return '<div class="jrow '+state+'"><span class="jn num">'+(x.gi+1)+'</span><div class="jt"><b>'+u.t+'</b><span>'+u.d+'</span></div><span class="jstatus">'+mark+'</span></div>';
    }).join('');
  }).join('');
  return '<div class="head"><div><h1>Meena\'s journey</h1><p class="sub">One patient, every workflow, start to finish — book, consult, plan, and the care in between. Each step plays on her WhatsApp; open Patient record or Scribe any time to see where it lands.</p></div><span class="chip '+(done?'good':'')+' num">'+Math.min(doneN,total)+' of '+total+' played</span></div>'
  +'<div class="stack"><div class="card">'+rows+'</div>'
  +(done
    ? '<div class="card"><h2 style="margin-bottom:4px">Journey complete</h2><p class="sub" style="margin:0 0 10px">Meena has been through every workflow this clinic has switched on.</p><button class="btn" id="jreset">Play it again</button></div>'
    : '<div class="row" style="justify-content:flex-end"><button class="btn primary lg" id="jnext">'+ic('play').replace('class="ic"','class="ic" style="width:14px;height:14px;fill:#fff"')+'Play next: '+UC.find(u=>u.id===JOURNEY[doneN]).t+'</button></div>')
  +'</div>';
}
let jRunning=false;
async function playJourneyNext(){
  if(jRunning||S.jstep>=JOURNEY.length)return;
  jRunning=true;
  const idx=S.jstep,id=JOURNEY[idx],my=++runId;
  if(idx===0){chat().innerHTML='';addDay()}
  if(window.innerWidth<=1240)$('#phonecol').scrollIntoView({behavior:'smooth',block:'center'});
  if(id==='scribe'){
    await sleep(300);if(my===runId){addMsg('sys','Dr. Mehta starts the consult. Scribe listens and drafts the note and prescription from the conversation, intake and glucose trend.');addEvent('Scribe','Consult note and prescription drafted — open the Scribe tab to see it')}
  }else{
    const ctx={last:'',hist:[],step:0,total:0};
    await exec(SC[id],my,ctx);
  }
  if(my===runId){S.jstep=idx+1;if(S.view==='journey')paint()}
  jRunning=false;
}

/* ---------- Views ---------- */
function vWork(){
  const n=Object.values(S.on).filter(Boolean).length;
  const list=UC.filter(u=>S.filter<0||u.s===S.filter);
  return '<div class="head"><div><h1>Workflows</h1><p class="sub">Switch on what your clinic needs. Each workflow runs on WhatsApp, reads from the patient record and writes back to it. Press Play to run one on the phone.</p></div><span class="chip good num">'+n+' of '+UC.length+' on</span></div>'
  +'<div class="stack">'
  +'<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Your rules for diabetes care</h2><span class="eyebrow">Used by alerts and readings</span></div><div class="targets">'
  +'<div class="field"><label for="tlo">Fasting target</label><div class="pair"><input id="tlo" data-t="lo" type="number" value="'+S.targets.lo+'" min="40" max="200"> to <input id="thi" data-t="hi" type="number" value="'+S.targets.hi+'" min="80" max="250"><span class="unit">mg/dL</span></div></div>'
  +'<div class="field"><label for="tal">Alert me above</label><div class="pair"><input id="tal" data-t="alert" type="number" value="'+S.targets.alert+'" min="150" max="500"><span class="unit">mg/dL</span></div></div>'
  +'<div class="field"><label>Agent may</label><div style="color:var(--ink-2);padding-top:6px">Explain, remind, book, flag. Never change treatment.</div></div></div></div>'
  +'<div class="filters" role="group" aria-label="Filter by stage"><button data-f="-1" aria-pressed="'+(S.filter<0)+'">All</button>'+STAGES.map((s,i)=>'<button data-f="'+i+'" aria-pressed="'+(S.filter===i)+'">'+s+'</button>').join('')+'</div>'
  +'<div class="grid">'+list.map(u=>'<article class="card uc'+(S.on[u.id]?'':' off')+'"><div class="top"><span class="eyebrow">'+STAGES[u.s]+'</span><button class="sw" role="switch" aria-checked="'+S.on[u.id]+'" aria-label="'+esc(u.t)+'" data-tg="'+u.id+'"></button></div>'
   +'<h3>'+u.t+'</h3><p>'+u.d+'</p><dl><dt>Starts when</dt><dd>'+u.w+'</dd><dt>Lands in EMR</dt><dd>'+u.e+'</dd></dl>'
   +'<div class="foot"><span class="chip '+(S.on[u.id]?'good':'')+'">'+(S.on[u.id]?'On':'Off')+'</span><div>'+'<button class="btn primary" data-play="'+u.id+'"'+(S.on[u.id]?'':' disabled')+'>'+ic('play').replace('class="ic"','class="ic" style="width:14px;height:14px;fill:#fff"')+'Play</button>'+(S.on[u.id]?'':'<div class="why">Switch on to play it</div>')+'</div></div></article>').join('')+'</div></div>';
}
function vToday(){
  const list=S.today.map(r=>{

  }).sort((a,b)=>FLAG_RANK[a.flag]-FLAG_RANK[b.flag]);

  const up=S.upcoming.length?'<div class="card"><h2 style="margin-bottom:8px">Upcoming</h2><div class="tw"><table><tbody>'+S.upcoming.map(u=>'<tr class="hl"><td><b>'+u.n+'</b></td><td>'+u.w+'</td><td><span class="chip '+(u.src==='WhatsApp'?'wa':'blue')+'">'+u.src+'</span></td></tr>').join('')+'</tbody></table></div></div>':'';
  return '<div class="head"><div><h1>Today\'s queue</h1><p class="sub">Wednesday 4 Nov. Bookings, check-ins and status changes from WhatsApp land here without desk entry. Red flags are sorted first.</p></div><span class="chip num">'+S.today.length+' patients</span></div><div class="stack"><div class="card"><div class="tw"><table><thead><tr><th>Time</th><th>Patient</th><th>Flag</th><th>Waiting</th><th>Booked via</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+up+'</div>';
}
function chart(){
  const R=S.readings,T=S.targets,W=640,H=230,pl=40,pr=16,pt=16,pb=28;
  const maxV=Math.max(200,...R.map(r=>r.v))+20,minV=60;
  const x=i=>pl+i*(W-pl-pr)/(R.length-1),y=v=>pt+(maxV-v)*(H-pt-pb)/(maxV-minV);
  let g='';for(let t=Math.ceil(minV/50)*50;t<=maxV;t+=50)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text x="'+(pl-8)+'" y="'+(y(t)+4)+'" text-anchor="end">'+t+'</text>';
  const path=R.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(r.v).toFixed(1)).join(' ');
  const pts=R.map((r,i)=>'<circle class="pt'+(i===R.length-1?' last':'')+(r.v>T.alert?' hi':'')+'" cx="'+x(i).toFixed(1)+'" cy="'+y(r.v).toFixed(1)+'" r="'+(i===R.length-1?5:3.5)+'"/>').join('');
  const L=R[R.length-1],lx=x(R.length-1);
  const xl=[0,Math.floor((R.length-1)/2),R.length-1].map((i,k)=>'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="'+(k===0?'start':k===2?'end':'middle')+'">'+R[i].d+'</text>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Fasting glucose readings with target band"><g class="gl">'+g+'</g><rect class="band" x="'+pl+'" width="'+(W-pl-pr)+'" y="'+y(T.hi)+'" height="'+(y(T.lo)-y(T.hi))+'"/><text class="bandlbl" x="'+(pl+6)+'" y="'+(y(T.hi)+13)+'">Target '+T.lo+' to '+T.hi+'</text><path class="ln" d="'+path+'"/>'+pts+'<text class="lbl" x="'+(lx-8)+'" y="'+(y(L.v)-10)+'" text-anchor="end">'+L.v+'</text>'+xl+'</svg>';
}
function vRecord(){
  const R=S.readings,T=S.targets,inT=R.filter(r=>r.v>=T.lo&&r.v<=T.hi).length,avg=Math.round(R.reduce((a,r)=>a+r.v,0)/R.length);

    +(a.state==='open'?'<div class="acts"><button class="btn" data-al="seen" data-i="'+i+'">Mark seen</button><button class="btn primary" data-al="reply" data-i="'+i+'">Reply on WhatsApp</button></div>':a.state==='seen'?'<div class="acts"><span class="chip warn">Seen</span><button class="btn primary" data-al="reply" data-i="'+i+'">Reply on WhatsApp</button></div>':'<div class="acts"><span class="chip good">Replied</span></div>')+'</div>'
    +(a.menu?'<div class="card" style="padding:10px"><div class="eyebrow" style="margin-bottom:6px">Send to patient</div><div class="row">'+['Take your medicine and test again in 2 hours.','Please come to the clinic today.','I will call you in 10 minutes.'].map((m,k)=>'<button class="btn" data-send="'+k+'" data-i="'+i+'">'+m+'</button>').join('')+'</div></div>':'')).join('');
  const sm=S.summary;

  S.events.forEach(e=>delete e.fresh);
  return '<div class="head"><div class="pt"><div class="av">MR</div><div><h1>Meena Rao</h1><div class="meta"><span><b>54 F</b></span><span>UHID <b>EK-20418</b></span><span>Type 2 diabetes since 2016</span><span>+91 98•••• 4120</span></div></div></div><button class="btn" data-go="scribe">'+ic('mic')+'Start consult in Scribe</button></div>'
  +'<div class="stack">'+alerts
  +'<div class="cols"><div class="stack">'
  +'<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:4px"><h2>Fasting glucose, last '+R.length+' readings</h2><span class="chip wa">From WhatsApp</span></div><div class="stat" style="margin:8px 0 12px"><div><b>'+avg+'</b><span>Average mg/dL</span></div><div><b>'+inT+' of '+R.length+'</b><span>In target</span></div><div><b>'+S.adherence+' of 7</b><span>Doses taken this week</span></div></div>'+chart()+'</div>'
  +'<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Before you walk in</h2><span class="chip blue">Drafted from WhatsApp and records</span></div><dl class="kv"><dt>Intake</dt><dd>'+intake+'</dd><dt>HbA1c</dt><dd><span class="num">'+S.labs.map(l=>l.v+'% ('+l.d+')').join(' → ')+'</span>'+(S.summary.report?' <span class="chip good">New report added</span>':'')+'</dd><dt>Medicines</dt><dd>Metformin 500 mg, twice daily. Glimepiride 1 mg, before breakfast.</dd><dt>Last visit</dt><dd>8 Jul. Continue medicines, walk after dinner.</dd></dl></div>'
  +'</div><div class="card"><h2 style="margin-bottom:4px">Activity</h2><ul class="feed">'+events+'</ul></div></div></div>';
}
function vOps(){
  const waiting=S.today.filter(r=>r.st==='Checked in').length;
  const consult=S.today.filter(r=>r.st==='In consult').length;
  const done=S.today.filter(r=>r.st==='Done').length;
  const onN=Object.values(S.on).filter(Boolean).length;
  const rev=done*600;

    else if(st.safety){ctx.step=Math.min(ctx.step+1,ctx.total);setFlowBar(ctx.step,ctx.total);ctx.last=await safetyCard(st.safety,my);ctx.hist.push(ctx.last);await sleep(250)}

 adhere:c=>{S.adherence=Math.min(7,S.adherence+1)},
 reading:c=>{S.readings.push({d:'Nov 4',v:c.val});if(S.readings.length>16)S.readings.shift()},
 alertHigh:c=>raise(c,'High reading',c.val,c.hist.includes('Yes')?'Patient reports danger signs and was told to call or go to emergency.':'No danger signs reported. Told to hydrate, take medicine, retest in 2 hours.'),
 alertLow:c=>raise(c,'Low reading',62,'Dizzy and sweaty after skipping lunch. Told to take sugar and retest. Call-back within 10 minutes.'),
 alertSym:c=>raise(c,'Symptoms, low sugar suspected',0,'Dizzy and sweaty, could not test. Told to take sugar. Call-back within 10 minutes.'),
 dizzy:c=>raise(c,'Dizziness after dose',0,'Patient skipped Glimepiride because of dizziness.')
};
function raise(c,kind,v,why){S.alerts.unshift({kind,v,why,t:tm(),state:'open'});drawNav();addEvent('WhatsApp','Alert raised: '+kind+(v?' '+v+' mg/dL':''))}

/* ---------- Free text ---------- */
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();const i=$('#msg'),v=i.value.trim();if(!v)return;i.value='';
  const my=++runId;const q=$('.quick');if(q)q.remove();addMsg('out',v);
  typing();await sleep(800);if(my!==runId)return;
  addMsg('in','I am not sure I can answer that safely. I have asked the clinic team to reply, usually within 30 minutes. If this is urgent, call 022 5555 0142.');
  addEvent('WhatsApp','Needs staff reply: "'+v.slice(0,60)+'"');
});

/* ---------- Events ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
$('#main').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='jnext')playJourneyNext();
  else if(t.id==='jreset'){S.jstep=0;chat().innerHTML='';hint();paint()}
  else if(t.dataset.play)run(t.dataset.play);
  else if(t.dataset.tg){S.on[t.dataset.tg]=!S.on[t.dataset.tg];paint()}
  else if(t.dataset.f!==undefined){S.filter=+t.dataset.f;paint()}
  else if(t.dataset.go)go(t.dataset.go);
  else if(t.dataset.al){const a=S.alerts[+t.dataset.i];if(t.dataset.al==='seen'){a.state='seen';addEvent('Doctor','Alert marked seen')}else{a.menu=true;a.state=a.state==='open'?'seen':a.state}drawNav();paint()}
  else if(t.dataset.send!==undefined){const a=S.alerts[+t.dataset.i];const m=['Take your medicine and test again in 2 hours.','Please come to the clinic today.','I will call you in 10 minutes.'][+t.dataset.send];
    a.state='done';a.menu=false;addMsg('in',m,{who:'Dr. Mehta'});addEvent('Doctor','Replied on WhatsApp: '+m);drawNav();paint();
    if(window.innerWidth<=1240)$('#phonecol').scrollIntoView({behavior:'smooth',block:'center'})}
});
$('#main').addEventListener('input',e=>{const t=e.target.dataset.t;if(t){const n=+e.target.value;if(n>0){S.targets[t]=n}}});
$('#reset').onclick=()=>{runId++;scribeRun++;S=fresh();hint();paint()};
$('#clearchat').onclick=()=>{runId++;hint()};
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v)&&v!==S.view){S.view=v;paint()}});
const h0=location.hash.slice(1);if(VIEWS.some(x=>x[0]===h0))S.view=h0;
hint();paint();
})();
</script>
</body></html>
